name: CI/CD Pipeline

# Lean CI matched to THIS repo (pnpm monorepo, zero-setup embedded DB, esbuild/vite builds).
# Replaces an earlier scaffolded pipeline that referenced non-existent scripts/packages
# (pnpm lint, -F web, db:migrate) plus Docker/registry/deploy steps needing secrets that
# do not exist here — it failed at "Install dependencies" on every run. These steps are all
# verified green locally. Backend e2e is run/verified out-of-band (its runtime varies) and
# can be promoted into CI once its harness exits deterministically under a fixed timeout.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Root typecheck builds the workspace lib project-references (tsc --build) first,
      # then typechecks every artifact package. Running per-package typecheck directly
      # fails on a clean runner (TS6305: lib dist not built yet).
      - name: Typecheck (build libs + all packages)
        run: pnpm run typecheck

      - name: Build api-server
        run: pnpm -F @workspace/api-server run build

      - name: Build frontend
        run: pnpm -F @workspace/pibazaar run build
        env:
          NODE_ENV: production
          PORT: '5173'
          BASE_PATH: /
